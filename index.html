<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cluster Monitor · 板块扩散扫描</title>
    <link rel="icon" href="public/favicon.svg" />
    <style>
      /* ---------------------------------------------------------------
         Design tokens
         --------------------------------------------------------------- */
      :root {
        color-scheme: light dark;

        --bg: #f4f5f2;
        --surface: #ffffff;
        --surface-sunken: #fafbf8;
        --border: #e3e5de;
        --border-strong: #d2d5cc;

        --ink: #1f242b;
        --ink-muted: #6b7480;
        --ink-faint: #949ba5;

        --accent: #4a63c8;
        --accent-soft: #eaeeff;
        --up: #1f8a63;
        --up-soft: #e2f2ea;
        --down: #c0435a;
        --down-soft: #fce7eb;
        --hold: #1f8497;
        --hold-soft: #ddf1f5;
        --warn: #a9741a;
        --warn-soft: #fdf0d8;

        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 1px 2px rgba(31, 36, 43, 0.04), 0 12px 32px rgba(31, 36, 43, 0.06);

        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171b;
          --surface: #1b1f24;
          --surface-sunken: #191d22;
          --border: #2b3138;
          --border-strong: #3a424b;

          --ink: #e6e9ed;
          --ink-muted: #98a1ad;
          --ink-faint: #6f7884;

          --accent: #8ea0ee;
          --accent-soft: #232a44;
          --up: #4cbf90;
          --up-soft: #1a2f28;
          --down: #e8798e;
          --down-soft: #33202a;
          --hold: #56b9cc;
          --hold-soft: #16303a;
          --warn: #d8a95a;
          --warn-soft: #33291a;

          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      .shell {
        max-width: 1560px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }

      .masthead {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .masthead p {
        margin: 6px 0 0;
        max-width: 62ch;
        color: var(--ink-muted);
        font-size: 13px;
      }

      .sync {
        display: grid;
        gap: 2px;
        justify-items: end;
        color: var(--ink-muted);
        font-size: 12px;
        text-align: right;
      }

      .sync strong {
        color: var(--ink);
        font-size: 13px;
        font-weight: 620;
      }

      /* ---------------------------------------------------------------
         Metric strip
         --------------------------------------------------------------- */
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .metric {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }

      .metric b {
        display: block;
        font-size: 24px;
        font-weight: 660;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .metric span {
        display: block;
        margin-top: 2px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .metric.setup b { color: var(--accent); }
      .metric.breakout b { color: var(--up); }
      .metric.holding b { color: var(--hold); }
      .metric.fakeout b { color: var(--down); }
      .metric.spring b { color: var(--warn); }

      /* ---------------------------------------------------------------
         Panel
         --------------------------------------------------------------- */
      .panel {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        padding: 0 14px;
      }

      .tabs button {
        position: relative;
        border: 0;
        background: none;
        color: var(--ink-muted);
        padding: 13px 12px 11px;
        font-size: 13px;
        font-weight: 620;
        cursor: pointer;
      }

      .tabs button::after {
        content: "";
        position: absolute;
        inset: auto 8px -1px;
        height: 2px;
        border-radius: 2px;
        background: transparent;
      }

      .tabs button[aria-selected="true"] {
        color: var(--ink);
      }

      .tabs button[aria-selected="true"]::after {
        background: var(--accent);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-sunken);
        padding: 12px 14px;
      }

      .toolbar .search {
        flex: 1 1 240px;
        min-width: 180px;
        max-width: 340px;
        height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 0 11px;
      }

      .toolbar .search::placeholder {
        color: var(--ink-faint);
      }

      .field {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .field select {
        height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 0 8px;
        font-size: 13px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0;
      }

      .chips {
        display: flex;
        gap: 6px;
      }

      .chip {
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink-muted);
        padding: 6px 11px;
        font-size: 12px;
        font-weight: 620;
        cursor: pointer;
      }

      .chip[aria-pressed="true"] {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chip.spring[aria-pressed="true"] {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .reset {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--ink-faint);
        font-size: 12px;
        cursor: pointer;
      }

      .reset:hover {
        color: var(--accent);
      }

      /* ---------------------------------------------------------------
         Tables
         --------------------------------------------------------------- */
      .table-wrap {
        overflow: auto;
        max-height: 62vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--border);
        background: var(--surface-sunken);
        padding: 0;
        text-align: left;
        white-space: nowrap;
      }

      th button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--ink-muted);
        padding: 10px 10px 9px;
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
      }

      th button:hover {
        color: var(--accent);
      }

      th .order {
        display: inline-grid;
        min-width: 15px;
        height: 15px;
        place-items: center;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        font-size: 9px;
        font-weight: 800;
      }

      tbody td {
        border-bottom: 1px solid var(--border);
        padding: 9px 10px;
        vertical-align: top;
        font-variant-numeric: tabular-nums;
      }

      tbody tr {
        cursor: pointer;
      }

      tbody tr:hover {
        background: var(--surface-sunken);
      }

      tbody tr[aria-selected="true"] {
        background: var(--accent-soft);
      }

      .num {
        text-align: right;
        white-space: nowrap;
      }

      .cluster-name strong {
        display: block;
        font-weight: 640;
      }

      .cluster-name span {
        color: var(--ink-muted);
        font-size: 11px;
      }

      .score {
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .score small {
        color: var(--ink-faint);
        font-size: 10px;
        font-weight: 600;
      }

      .score.tier-3 { color: var(--up); }
      .score.tier-2 { color: var(--warn); }
      .score.tier-1 { color: var(--ink-muted); }
      .score.tier-0 { color: var(--ink-faint); }

      /* Ticker cells */
      .tickers {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        max-width: 250px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        color: var(--ink);
        padding: 3px 6px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 620;
        text-decoration: none;
        border: 1px solid var(--border);
      }

      .tag:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .tag i {
        border-radius: 3px;
        padding: 0 3px;
        font-size: 8px;
        font-style: normal;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .tag i.spring { background: var(--warn-soft); color: var(--warn); }
      .tag i.tight { background: var(--accent-soft); color: var(--accent); }
      .tag i.setup { background: var(--accent-soft); color: var(--accent); }
      .tag i.breakout { background: var(--up-soft); color: var(--up); }
      .tag i.holding { background: var(--hold-soft); color: var(--hold); }
      .tag i.fakeout { background: var(--down-soft); color: var(--down); }

      .total {
        border-radius: 999px;
        background: var(--surface-sunken);
        border: 1px solid var(--border);
        color: var(--ink-faint);
        padding: 2px 7px;
        font-size: 10px;
        font-weight: 700;
      }

      .empty {
        color: var(--ink-faint);
      }

      /* State pills */
      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .pill.setup { background: var(--accent-soft); color: var(--accent); }
      .pill.breakout { background: var(--up-soft); color: var(--up); }
      .pill.holding { background: var(--hold-soft); color: var(--hold); }
      .pill.fakeout { background: var(--down-soft); color: var(--down); }
      .pill.watch { background: var(--surface-sunken); color: var(--ink-muted); border: 1px solid var(--border); }

      .gain { color: var(--up); }
      .loss { color: var(--down); }

      /* ---------------------------------------------------------------
         Detail drawer
         --------------------------------------------------------------- */
      .detail {
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(280px, 1fr);
        gap: 22px;
        border-top: 1px solid var(--border);
        background: var(--surface-sunken);
        padding: 18px;
      }

      .detail h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
      }

      .detail h3 {
        margin: 0 0 8px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .detail .lede {
        margin: 4px 0 14px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .rules {
        display: grid;
        gap: 1px;
      }

      .rule {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        gap: 8px;
        align-items: center;
        border-radius: var(--radius-sm);
        color: var(--ink-faint);
        padding: 6px 7px;
        font-size: 12px;
      }

      .rule.hit {
        background: var(--up-soft);
        color: var(--up);
      }

      .rule b {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .ladder-row {
        display: grid;
        grid-template-columns: 108px 1fr;
        gap: 10px;
        align-items: start;
        border-top: 1px solid var(--border);
        padding: 9px 0;
      }

      .ladder-row > span {
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ---------------------------------------------------------------
         Definitions
         --------------------------------------------------------------- */
      .definitions {
        margin-top: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .definitions header {
        margin-bottom: 14px;
      }

      .definitions h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      .definitions header p {
        margin: 5px 0 0;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .definition-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
      }

      .definition-grid article {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        padding: 12px;
      }

      .definition-grid b {
        font-size: 12px;
      }

      .definition-grid p {
        margin: 6px 0 0;
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .definitions footer {
        margin-top: 14px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
        color: var(--ink-faint);
        font-size: 12px;
      }

      .status-line {
        padding: 40px 16px;
        color: var(--ink-muted);
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 900px) {
        .shell { padding: 16px 12px 32px; }
        .detail { grid-template-columns: 1fr; }
        .table-wrap { max-height: none; }
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <div class="eyebrow">Market Breadth</div>
          <h1>Cluster Monitor</h1>
          <p>
            在同一板块里找"前排已突破 + 后排正准备"的资金扩散结构。个股状态由扫描器判定后写入数据，页面只负责呈现。
          </p>
        </div>
        <div class="sync">
          <strong id="syncCount">读取中…</strong>
          <span id="syncTime"></span>
          <span id="presetName"></span>
        </div>
      </header>

      <section class="metrics" id="metrics"></section>

      <section class="panel">
        <nav class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-view="clusters">板块群组</button>
          <button role="tab" aria-selected="false" data-view="stocks">个股明细</button>
        </nav>

        <!-- Cluster view -->
        <div data-panel="clusters">
          <div class="toolbar">
            <input class="search" id="clusterSearch" placeholder="搜索板块、ETF 或成分股" />
            <label class="field">
              RMV 紧密度
              <select id="rangeBand">
                <option value="">不限</option>
                <option value="0-10">≤ 10 · 很紧</option>
                <option value="10-15">10 – 15 · 收紧中</option>
                <option value="15-40">15 – 40 · 一般</option>
                <option value="40-101">&gt; 40 · 已放大</option>
              </select>
            </label>
            <div class="chips">
              <button class="chip spring" data-flag="springTag" aria-pressed="false">Spring</button>
              <button class="chip" data-flag="tightnessTag" aria-pressed="false">Tight</button>
            </div>
            <button class="reset" id="clusterReset">清除筛选</button>
          </div>
          <div class="table-wrap">
            <table id="clusterTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="detail" id="clusterDetail"></div>
        </div>

        <!-- Stock view -->
        <div data-panel="stocks" hidden>
          <div class="toolbar">
            <input class="search" id="stockSearch" placeholder="搜索代码或公司名" />
            <label class="field">
              主状态
              <select id="stateFilter">
                <option value="">全部</option>
                <option value="breakout">Breakout</option>
                <option value="holding">Holding</option>
                <option value="setup">Setup</option>
                <option value="fakeout">Fakeout</option>
                <option value="watch">Watch</option>
              </select>
            </label>
            <div class="chips">
              <button class="chip spring" data-stock-flag="springTag" aria-pressed="false">Spring</button>
              <button class="chip" data-stock-flag="tightnessTag" aria-pressed="false">Tight</button>
            </div>
            <button class="reset" id="stockReset">清除筛选</button>
          </div>
          <div class="table-wrap">
            <table id="stockTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="definitions">
        <header>
          <h2>扫描规则</h2>
          <p>
            主状态按 Fakeout → Breakout → Holding → Setup → Watch 依次判定，每只股票只有一个主状态；
            Spring 与 Tight 是并行的附加标签。下方阈值直接读自扫描器参数，不会与代码脱节。
          </p>
        </header>
        <div class="definition-grid" id="definitions"></div>
        <footer id="definitionsFooter"></footer>
      </section>
    </main>

    <script type="module">
      // The leader rules come from the same module the scanner uses, so the
      // page cannot quietly disagree with the feed about who leads a group.
      import { pickLeaders } from "./scripts/rules.js";

      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (char) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      const percent = (value) => (Number.isFinite(value) ? `${Number(value).toFixed(1)}%` : "—");
      const signed = (value) =>
        Number.isFinite(value) ? `${value > 0 ? "+" : ""}${Number(value).toFixed(1)}%` : "—";
      const number = (value, digits = 2) =>
        Number.isFinite(value) ? Number(value).toFixed(digits) : "—";

      const STATE_LABEL = {
        setup: "Setup",
        breakout: "Breakout",
        holding: "Holding",
        fakeout: "Fakeout",
        watch: "Watch",
      };

      const app = {
        feed: null,
        stocks: [],
        clusters: [],
        selected: null,
        clusterSort: ["score", "breakout"],
        stockSort: ["state", "distanceToHighPct"],
        clusterQuery: "",
        stockQuery: "",
        rangeBand: "",
        stateFilter: "",
        clusterFlags: { springTag: false, tightnessTag: false },
        stockFlags: { springTag: false, tightnessTag: false },
      };

      // -----------------------------------------------------------------
      // Cluster assembly
      // -----------------------------------------------------------------

      /** A stock can belong to several themes; `theme` and `group` pair by index. */
      function membershipsOf(stock) {
        if (!stock.strong) return [];
        const themes = String(stock.theme ?? "").split("/").map((value) => value.trim());
        const groups = String(stock.group ?? stock.theme ?? "").split("/").map((value) => value.trim());
        return themes.map((theme, index) => ({ theme, label: groups[index] ?? groups[0] ?? theme }));
      }

      /** Highest weight this stock carries inside the cluster's ETFs. */
      function weightInCluster(stock, theme) {
        const raw = stock.weightsByTheme?.[theme] ?? stock.weight ?? "";
        const found = String(raw).match(/\d+(?:\.\d+)?(?=%)/g);
        return found ? Math.max(...found.map(Number)) : 0;
      }

      function sectorIndex(feed) {
        const index = new Map();
        (feed.sectors ?? []).forEach((sector, position) => {
          index.set(sector.ticker, { ...sector, rank: position + 1 });
        });
        return index;
      }

      function scoreCluster(cluster, sectors) {
        const members = cluster.theme.split("+");
        const sector = members.map((ticker) => sectors.get(ticker)).find(Boolean);
        const rank = Math.min(
          ...members.map((ticker) => sectors.get(ticker)?.rank ?? Infinity),
        );
        const fiveDay = Number.parseFloat(sector?.fiveDay ?? "") || 0;
        const trending = /Strong Trend|Uptrend/i.test(sector?.status ?? "");
        const heldRecently = cluster.holding.filter((stock) => (stock.breakoutDaysAgo ?? 99) <= 5);
        const tagged = cluster.all.filter((stock) => stock.springTag || stock.tightnessTag);

        const rules = [
          ["Setup ≥ 3 只", 1, cluster.setup.length >= 3],
          ["今日 Breakout ≥ 2 只", 2, cluster.breakout.length >= 2],
          ["近 5 日突破且守住 ≥ 2 只", 2, heldRecently.length >= 2],
          ["板块排名前 40", 1, Number.isFinite(rank) && rank <= 40],
          ["一周涨幅 ≥ 2%", 1, fiveDay >= 2],
          ["ETF 处于上升趋势", 1, trending],
          ["至少一只 RS ≥ 95", 1, cluster.all.some((stock) => (stock.rs ?? 0) >= 95)],
          ["Spring / Tight 标签 ≥ 2 只", 1, tagged.length >= 2],
        ];

        return {
          rules,
          score: rules.reduce((total, [, weight, hit]) => total + (hit ? weight : 0), 0),
          rank: Number.isFinite(rank) ? rank : null,
          trending,
        };
      }

      function buildClusters() {
        const sectors = sectorIndex(app.feed);
        const pool = app.stocks.filter(inRangeBand);
        const buckets = new Map();

        for (const stock of pool) {
          for (const { theme, label } of membershipsOf(stock)) {
            if (!buckets.has(theme)) buckets.set(theme, { theme, label, all: [] });
            const bucket = buckets.get(theme);
            if (!bucket.all.some((item) => item.ticker === stock.ticker)) bucket.all.push(stock);
          }
        }

        app.clusters = [...buckets.values()].map((bucket) => {
          const byState = (state) => bucket.all.filter((stock) => stock.mainState === state);
          const cluster = {
            ...bucket,
            setup: byState("setup"),
            breakout: byState("breakout"),
            holding: byState("holding"),
            fakeout: byState("fakeout"),
            watch: byState("watch"),
          };
          cluster.leaders = pickLeaders(cluster.all, (stock) =>
            weightInCluster(stock, cluster.theme),
          );
          const laggards = [...cluster.all].sort((a, b) => (a.rs ?? 0) - (b.rs ?? 0));
          cluster.laggard = laggards.find((stock) => !cluster.leaders.includes(stock)) ?? null;
          return { ...cluster, ...scoreCluster(cluster, sectors) };
        });
      }

      function inRangeBand(stock) {
        if (!app.rangeBand) return true;
        const [low, high] = app.rangeBand.split("-").map(Number);
        const value = stock.rmv;
        return Number.isFinite(value) && value >= low && value < high;
      }

      // -----------------------------------------------------------------
      // Sorting — click a header to add it as a sort level, click again to drop
      // -----------------------------------------------------------------

      function toggleSort(levels, key) {
        const position = levels.indexOf(key);
        if (position >= 0) levels.splice(position, 1);
        else if (levels.length < 3) levels.push(key);
        else levels[2] = key;
      }

      function sortBy(rows, levels, valueOf) {
        return [...rows].sort((a, b) => {
          for (const key of levels) {
            const left = valueOf(a, key);
            const right = valueOf(b, key);
            if (typeof left === "string" || typeof right === "string") {
              const difference = String(left).localeCompare(String(right));
              if (difference) return difference;
            } else if (left !== right) {
              return right - left;
            }
          }
          return 0;
        });
      }

      function renderHead(table, columns, levels) {
        table.querySelector("thead").innerHTML = `<tr>${columns
          .map(([key, label, alignRight]) => {
            const position = levels.indexOf(key);
            const order = position >= 0 ? `<span class="order">${position + 1}</span>` : "";
            return `<th${alignRight ? ' class="num"' : ""}><button data-sort="${key}">${label}${order}</button></th>`;
          })
          .join("")}</tr>`;
      }

      // -----------------------------------------------------------------
      // Cell renderers
      // -----------------------------------------------------------------

      function tickerTag(stock, { showState = false } = {}) {
        const flags = [];
        if (showState) flags.push(`<i class="${stock.mainState}">${STATE_LABEL[stock.mainState]}</i>`);
        if (stock.springTag) flags.push('<i class="spring">SPRING</i>');
        if (stock.tightnessTag) flags.push('<i class="tight">TIGHT</i>');
        const title = `${stock.name ?? stock.ticker} · RS ${stock.rs ?? "—"} · 3M ${signed(stock.threeMonthPct)}`;
        return `<a class="tag" target="_blank" rel="noreferrer" title="${escapeHtml(title)}"
          href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(stock.ticker)}"
        >${escapeHtml(stock.ticker)}${flags.join("")}</a>`;
      }

      function tickerCell(stocks, { limit = 4, showState = false } = {}) {
        if (!stocks.length) return '<span class="empty">—</span>';
        const shown = stocks.slice(0, limit).map((stock) => tickerTag(stock, { showState }));
        const overflow =
          stocks.length > limit ? `<span class="total">+${stocks.length - limit}</span>` : "";
        return `<div class="tickers">${shown.join("")}${overflow}</div>`;
      }

      const scoreTier = (score) => (score >= 8 ? 3 : score >= 6 ? 2 : score >= 3 ? 1 : 0);

      // -----------------------------------------------------------------
      // Rendering
      // -----------------------------------------------------------------

      const CLUSTER_COLUMNS = [
        ["label", "板块 / ETF"],
        ["score", "Score", true],
        ["setup", "Setup", true],
        ["breakout", "Breakout", true],
        ["holding", "Holding", true],
        ["fakeout", "Fakeout", true],
        ["leaders", "Leaders"],
        ["laggard", "弱势对照"],
      ];

      const clusterValue = (cluster, key) => {
        if (key === "label") return cluster.label;
        if (key === "score") return cluster.score;
        if (key === "leaders") return cluster.leaders.length ? weightInCluster(cluster.leaders[0], cluster.theme) : 0;
        if (key === "laggard") return -(cluster.laggard?.rs ?? 999);
        return cluster[key]?.length ?? 0;
      };

      function visibleClusters() {
        const query = app.clusterQuery.toLowerCase();
        return app.clusters.filter((cluster) => {
          const flagged = Object.entries(app.clusterFlags).every(
            ([flag, on]) => !on || cluster.all.some((stock) => stock[flag]),
          );
          const haystack = `${cluster.label} ${cluster.theme} ${cluster.all
            .map((stock) => stock.ticker)
            .join(" ")}`.toLowerCase();
          return flagged && haystack.includes(query);
        });
      }

      function renderClusters() {
        const rows = sortBy(visibleClusters(), app.clusterSort, clusterValue);
        const table = $("clusterTable");
        renderHead(table, CLUSTER_COLUMNS, app.clusterSort);

        if (!rows.some((cluster) => cluster.theme === app.selected)) {
          app.selected = rows[0]?.theme ?? null;
        }

        table.querySelector("tbody").innerHTML = rows
          .map((cluster) => {
            const stateCell = (stocks) =>
              stocks.length
                ? `<div class="tickers">${stocks
                    .slice(0, 3)
                    .map((stock) => tickerTag(stock))
                    .join("")}<span class="total">${stocks.length}</span></div>`
                : '<span class="empty">—</span>';
            return `<tr data-theme="${escapeHtml(cluster.theme)}" aria-selected="${cluster.theme === app.selected}">
              <td class="cluster-name">
                <strong>${escapeHtml(cluster.label)}</strong>
                <span>${escapeHtml(cluster.theme)} · Rank ${cluster.rank ?? "—"}${cluster.trending ? " ↑" : ""}</span>
              </td>
              <td class="num"><span class="score tier-${scoreTier(cluster.score)}">${cluster.score}<small>/10</small></span></td>
              <td>${stateCell(cluster.setup)}</td>
              <td>${stateCell(cluster.breakout)}</td>
              <td>${stateCell(cluster.holding)}</td>
              <td>${stateCell(cluster.fakeout)}</td>
              <td>${tickerCell(cluster.leaders, { limit: 3, showState: true })}</td>
              <td>${cluster.laggard ? tickerTag(cluster.laggard) : '<span class="empty">—</span>'}</td>
            </tr>`;
          })
          .join("");

        renderDetail(rows.find((cluster) => cluster.theme === app.selected));
        renderMetrics(rows);
      }

      function renderDetail(cluster) {
        if (!cluster) {
          $("clusterDetail").innerHTML =
            '<p class="status-line">没有符合当前筛选条件的板块群组。</p>';
          return;
        }

        const ladder = [
          ["Leaders", cluster.leaders],
          ["Breakout", cluster.breakout],
          ["Holding", cluster.holding],
          ["Setup", cluster.setup],
          ["Fakeout", cluster.fakeout],
          ["Watch", cluster.watch],
        ];

        $("clusterDetail").innerHTML = `
          <div>
            <h2>${escapeHtml(cluster.label)}</h2>
            <p class="lede">${escapeHtml(cluster.theme)} · ${cluster.all.length} 只成分股 · Score ${cluster.score}/10</p>
            <h3>Score 明细</h3>
            <div class="rules">
              ${cluster.rules
                .map(
                  ([text, weight, hit]) => `<div class="rule ${hit ? "hit" : ""}">
                    <span>${hit ? "✓" : "·"}</span><span>${escapeHtml(text)}</span><b>+${weight}</b>
                  </div>`,
                )
                .join("")}
            </div>
          </div>
          <div>
            <h3>板块梯队</h3>
            ${ladder
              .map(
                ([label, stocks]) => `<div class="ladder-row">
                  <span>${label}</span>${tickerCell(stocks, { limit: 8 })}
                </div>`,
              )
              .join("")}
          </div>`;
      }

      function renderMetrics(clusters) {
        const total = (key) => clusters.reduce((sum, cluster) => sum + cluster[key].length, 0);
        const unique = (predicate) =>
          new Set(app.stocks.filter(predicate).map((stock) => stock.ticker)).size;

        $("metrics").innerHTML = [
          ["", clusters.length, "活跃群组"],
          ["setup", total("setup"), "Setup"],
          ["breakout", total("breakout"), "Breakout"],
          ["holding", total("holding"), "Holding"],
          ["fakeout", total("fakeout"), "Fakeout"],
          ["spring", unique((stock) => stock.springTag), "Spring 标签"],
          ["", unique((stock) => stock.tightnessTag), "Tight 标签"],
        ]
          .map(
            ([tone, value, label]) =>
              `<div class="metric ${tone}"><b>${value}</b><span>${label}</span></div>`,
          )
          .join("");
      }

      // -----------------------------------------------------------------
      // Stock table
      // -----------------------------------------------------------------

      const STOCK_COLUMNS = [
        ["ticker", "代码"],
        ["label", "板块"],
        ["state", "主状态"],
        ["rs", "RS", true],
        ["threeMonthPct", "3 个月", true],
        ["distanceToHighPct", "距 20 日高", true],
        ["rmv", "RMV", true],
        ["volumeDryUp", "缩量", true],
        ["rvol", "RVOL", true],
        ["closePosition", "收盘位置", true],
        ["close", "收盘", true],
        ["pivot", "Pivot", true],
        ["dollarVol", "$Vol 50", true],
      ];

      const STATE_ORDER = { breakout: 0, holding: 1, setup: 2, fakeout: 3, watch: 4 };

      const stockValue = (stock, key) => {
        if (key === "ticker") return stock.ticker;
        if (key === "label") return stock.strong ? (stock.group ?? "") : "￿";
        if (key === "state") return -STATE_ORDER[stock.mainState];
        if (key === "distanceToHighPct") return -(stock.distanceToHighPct ?? 999);
        if (key === "rmv") return -(stock.rmv ?? 999);
        if (key === "volumeDryUp") return -(stock.volumeDryUp ?? 999);
        if (key === "dollarVol") return stock.averageDollarVolume ?? 0;
        return stock[key] ?? 0;
      };

      function renderStocks() {
        const query = app.stockQuery.toLowerCase();
        const rows = sortBy(
          app.stocks.filter((stock) => {
            const flagged = Object.entries(app.stockFlags).every(([flag, on]) => !on || stock[flag]);
            const stateOk = !app.stateFilter || stock.mainState === app.stateFilter;
            const haystack = `${stock.ticker} ${stock.name ?? ""}`.toLowerCase();
            return flagged && stateOk && haystack.includes(query);
          }),
          app.stockSort,
          stockValue,
        );

        const table = $("stockTable");
        renderHead(table, STOCK_COLUMNS, app.stockSort);
        table.querySelector("tbody").innerHTML = rows
          .map(
            (stock) => `<tr>
              <td>${tickerTag(stock)}</td>
              <td class="cluster-name"><span>${stock.strong ? escapeHtml(stock.group) : "—"}</span></td>
              <td><span class="pill ${stock.mainState}">${STATE_LABEL[stock.mainState]}</span></td>
              <td class="num">${stock.rs ?? "—"}</td>
              <td class="num ${stock.threeMonthPct >= 0 ? "gain" : "loss"}">${signed(stock.threeMonthPct)}</td>
              <td class="num">${percent(stock.distanceToHighPct)}</td>
              <td class="num">${Number.isFinite(stock.rmv) ? stock.rmv.toFixed(0) : "—"}</td>
              <td class="num">${number(stock.volumeDryUp)}</td>
              <td class="num">${number(stock.rvol)}</td>
              <td class="num">${Number.isFinite(stock.closePosition) ? `${stock.closePosition}%` : "—"}</td>
              <td class="num">${number(stock.close)}</td>
              <td class="num">${number(stock.pivot)}</td>
              <td class="num">${escapeHtml(stock.dollarVol ?? "—")}</td>
            </tr>`,
          )
          .join("");
      }

      // -----------------------------------------------------------------
      // Definitions, rendered from the scanner's own parameters
      // -----------------------------------------------------------------

      function renderDefinitions(params) {
        const p = params ?? {};
        // Presets can express tightness either way, so describe whichever
        // one is actually in force rather than hardcoding a sentence.
        const tightSetup = p.setupMaxRmv != null
          ? `RMV ≤ ${p.setupMaxRmv}`
          : `15D Range ≤ ${p.setupMaxRange15Pct}%`;
        const tightTag = p.tightnessMaxRmv != null
          ? `RMV &lt; ${p.tightnessMaxRmv}`
          : `15D Range &lt; ${p.tightnessMaxRange15Pct}%`;
        const trend = p.setupRequireMaStack
          ? "收盘 &gt; SMA20 &gt; SMA50（要求均线排列）"
          : "收盘 &gt; SMA20 且 &gt; SMA50";
        const dryUp = p.setupMaxVolumeDryUp != null
          ? `10 日均量 ÷ 50 日均量 &lt; ${p.setupMaxVolumeDryUp}（基座缩量）；`
          : "";
        const rsGate = p.setupMinRsRating != null
          ? `RS Rating ≥ ${p.setupMinRsRating}；`
          : `3 个月涨幅 &gt; ${p.setupMinThreeMonthPct}%；`;

        const cards = [
          [
            "Setup",
            `${trend}；距 20 日最高价 0–${p.setupMaxDistanceToHighPct}%；${tightSetup}；
             ${dryUp}${rsGate}以上条件须同时成立。`,
          ],
          [
            "Breakout",
            `收盘突破<b>前一日</b>的 20 日最高价，RVOL ≥ ${p.breakoutMinRvol}，
             收盘位置 ≥ ${p.breakoutMinClosePosition}%${
               p.breakoutRequireVolumeAbovePriorDay ? "，且成交量高于前一日" : ""
             }。该 20 日高即此后要守的 pivot。`,
          ],
          [
            "Holding",
            `过去 ${p.holdingLookbackDays} 个交易日内出现过有效 Breakout，且最新收盘同时站在
             该 pivot 之上与 21EMA × ${p.holdingEma21Buffer} 之上。`,
          ],
          [
            "Fakeout",
            `A：日内刺穿前一日 20 日高但收盘跌回其下，RVOL ≥ ${p.fakeoutMinRvol} 且收盘位置 &lt;
             ${p.fakeoutMaxClosePosition}%。B：过去 1–${p.fakeoutLookbackDays} 日的有效 Breakout，现已跌回 pivot 之下。`,
          ],
          [
            "Spring · 附加标签",
            `最近 ${p.springLookbackDays} 日内最低价下破前 5 日最低点 0 至 ${p.springUndercutMinPct}%；
             其后 1–${p.springReclaimWindow} 日内收复该支撑，且收复当日涨幅 ≥ ${p.springMinGainPct}%、
             收盘位置 ≥ ${p.springMinClosePosition}%、RVOL ≥ ${p.springMinRvol}${
               p.springRequireVolumeAbovePriorDay ? "、成交量高于前一日" : ""
             }；当前价仍高于收复日收盘且支撑未再失守。`,
          ],
          [
            "Tight · 附加标签",
            `满足 Setup 的<b>全部条件</b>且 ${tightTag}。判定依据是 Setup 条件本身，
             因此一只 Breakout 股票同样可以带 Tight 标签。`,
          ],
          [
            "Leaders",
            `资格池为 Setup / Breakout / Holding，以及带 Spring 标签的 Watch；Fakeout 一律无资格。
             排序值 = 市值 × (1 + ETF 权重 ÷ ${p.leaderWeightDivisor})，最多 ${p.leaderLimit} 只。`,
          ],
          [
            "RMV · 紧密度",
            `把 ${(p.rmvAtrPeriods ?? [5, 10, 15]).join(" / ")} 日的相对真实波幅取平均，再在最近
             ${p.rmvLookback} 根 K 线内归一化到 0–100。0 最紧、100 最放大。用归一化而不是绝对振幅，
             是为了让高波动股和低波动股用同一把尺子——绝对阈值会系统性漏掉前者、放进后者。`,
          ],
          [
            "基础指标",
            `RVOL = 当日成交量 ÷ 50 日均量；收盘位置 = (收盘 − 最低) ÷ (最高 − 最低) × 100；
             距 20 日高 = (20 日最高 − 收盘) ÷ 20 日最高 × 100；3 个月涨幅取 ${p.threeMonthBars} 个交易日。`,
          ],
        ];

        $("definitions").innerHTML = cards
          .map(([title, body]) => `<article><b>${title}</b><p>${body}</p></article>`)
          .join("");
      }

      // -----------------------------------------------------------------
      // Wiring
      // -----------------------------------------------------------------

      document.querySelectorAll("[data-view]").forEach((tab) => {
        tab.onclick = () => {
          document.querySelectorAll("[data-view]").forEach((other) => {
            other.setAttribute("aria-selected", String(other === tab));
          });
          document.querySelectorAll("[data-panel]").forEach((panel) => {
            panel.hidden = panel.dataset.panel !== tab.dataset.view;
          });
        };
      });

      $("clusterSearch").oninput = (event) => {
        app.clusterQuery = event.target.value;
        renderClusters();
      };
      $("stockSearch").oninput = (event) => {
        app.stockQuery = event.target.value;
        renderStocks();
      };
      $("rangeBand").onchange = (event) => {
        app.rangeBand = event.target.value;
        buildClusters();
        renderClusters();
      };
      $("stateFilter").onchange = (event) => {
        app.stateFilter = event.target.value;
        renderStocks();
      };

      document.querySelectorAll("[data-flag]").forEach((chip) => {
        chip.onclick = () => {
          const flag = chip.dataset.flag;
          app.clusterFlags[flag] = !app.clusterFlags[flag];
          chip.setAttribute("aria-pressed", String(app.clusterFlags[flag]));
          renderClusters();
        };
      });

      document.querySelectorAll("[data-stock-flag]").forEach((chip) => {
        chip.onclick = () => {
          const flag = chip.dataset.stockFlag;
          app.stockFlags[flag] = !app.stockFlags[flag];
          chip.setAttribute("aria-pressed", String(app.stockFlags[flag]));
          renderStocks();
        };
      });

      $("clusterReset").onclick = () => {
        app.clusterQuery = "";
        app.rangeBand = "";
        app.clusterFlags = { springTag: false, tightnessTag: false };
        $("clusterSearch").value = "";
        $("rangeBand").value = "";
        document.querySelectorAll("[data-flag]").forEach((chip) => chip.setAttribute("aria-pressed", "false"));
        buildClusters();
        renderClusters();
      };

      $("stockReset").onclick = () => {
        app.stockQuery = "";
        app.stateFilter = "";
        app.stockFlags = { springTag: false, tightnessTag: false };
        $("stockSearch").value = "";
        $("stateFilter").value = "";
        document.querySelectorAll("[data-stock-flag]").forEach((chip) => chip.setAttribute("aria-pressed", "false"));
        renderStocks();
      };

      // Header sorting and row selection, delegated so re-renders keep working.
      $("clusterTable").addEventListener("click", (event) => {
        const header = event.target.closest("[data-sort]");
        if (header) {
          toggleSort(app.clusterSort, header.dataset.sort);
          renderClusters();
          return;
        }
        const row = event.target.closest("[data-theme]");
        if (row && !event.target.closest("a")) {
          app.selected = row.dataset.theme;
          renderClusters();
        }
      });

      $("stockTable").addEventListener("click", (event) => {
        const header = event.target.closest("[data-sort]");
        if (header) {
          toggleSort(app.stockSort, header.dataset.sort);
          renderStocks();
        }
      });

      // -----------------------------------------------------------------
      // Boot
      // -----------------------------------------------------------------

      fetch("public/screener-feed.json")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((feed) => {
          app.feed = feed;
          app.stocks = feed.candidates ?? [];
          $("syncCount").textContent = `${app.stocks.length} 只 · ${
            feed.universeCount ?? "—"
          } 只票池`;
          $("presetName").textContent = feed.preset ? `参数组 ${feed.preset}` : "";
          $("syncTime").textContent = new Date(feed.updatedAt).toLocaleString("zh-CN");
          $("definitionsFooter").textContent =
            `票池要求 50 日日均成交额 ≥ $20M。Cluster Score 用于集中注意力，不是买入信号。`;
          renderDefinitions(feed.params);
          buildClusters();
          renderClusters();
          renderStocks();
        })
        .catch((error) => {
          $("syncCount").textContent = "数据读取失败";
          $("syncTime").textContent = error.message;
          renderDefinitions(null);
        });
    </script>
  </body>
</html>
